[project]
name = "voice-type"
version = "0.1.0"
description = "Voice dictation for Ubuntu GNOME Wayland (local Whisper or OpenAI-compatible API)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kang Feipeng" }]
dependencies = [
    "faster-whisper>=1.1.0",
    "httpx>=0.27",
]

[project.scripts]
voice-type = "voice_type.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_type"]
